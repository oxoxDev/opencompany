# Hot-reload overlay used by scripts/launch-demo.sh.
services:
  opencompany:
    build:
      target: development
    image: opencompany-dev:local
    command:
      - cargo
      - watch
      - --poll
      - --watch
      - crates/opencompany-core/src
      - --watch
      - companies
      - --watch
      - Cargo.toml
      - --watch
      - crates/opencompany-core/Cargo.toml
      - --watch
      - Cargo.lock
      - --watch
      - scripts/run-demo-backend.sh
      - --shell
      - ./scripts/run-demo-backend.sh
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 3s
      timeout: 2s
      # A first launch compiles the Rust dependency graph into the named cache
      # volume. Two minutes is not enough on a cold machine, and marking the
      # host unhealthy prevents Compose from ever starting the console.
      start_period: 10m
      retries: 20
    volumes:
      - ..:/workspace
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - cargo-target:/workspace/target
      - opencompany-data:/data
    restart: "no"

  console:
    build:
      target: development
    image: opencompany-console-dev:local
    command:
      - /bin/sh
      - -c
      - npm install && exec npm run dev -- --host 0.0.0.0 --port 80
    environment:
      OC_API_TARGET: http://opencompany:8080
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ../frontend:/app
      - frontend-node-modules:/app/node_modules
    restart: "no"

volumes:
  cargo-registry:
    name: opencompany-cargo-registry
    external: true
  cargo-git:
    name: opencompany-cargo-git
    external: true
  cargo-target:
    name: opencompany-cargo-target
    external: true
  frontend-node-modules:
    name: opencompany-frontend-node-modules
    external: true
