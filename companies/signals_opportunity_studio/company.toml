# Agent roster for the Signals + Opportunity Engine harness.
#
# Signals and the Opportunity Engine are NOT kernel code. They are realized
# here — over the existing OpenCompany ports — as a roster plus a charter plus
# schedules:
#
#   * ingress  → channels (operator/email) and the POST /hooks/{company}/{channel}
#                webhook path carry raw signals into the company
#   * memory   → the runtime's MemoryStore/ContextStore hold the signal corpus
#   * reasoning → the brain clusters pain, ranks opportunities, drafts the digest
#   * cadence  → [[schedule]] entries drive the weekly scan/rank/report loop
#
# The OpenCompany host instantiates one runtime agent per `agents/<id>.toml`, backed by
# the vendored OpenHuman / TinyAgents modules.

[company]
name = "Signals + Opportunity Studio"
output = "A ranked weekly opportunity brief the operator can act on"
human_role = "Deciding which opportunities to fund and pursue"
handle = "signalstudio"

[brain]
mode = "hosted"
max_passes = 12

[tools]
# This company deliberately overrides the default belt (`["*", "media",
# "composio"]`) down to reading and writing docs off the web — it is a research
# studio, not a general-purpose one. `search` is added because the whole roster
# is described as gathering signals "from web", and the grant check matches only
# `search` / `search.` — `web.*` confers nothing towards it (#312).
#
# This list gates the company; each agent's own `tools` narrows it further, so
# `search` also has to appear on the scout / analyst / research agents above.
allow = ["web.*", "docs.*", "search"]

[channels.operator]
enabled = true

[channels.email]
enabled = true

[policy]
mode = "supervised"
# `always_approve` names the thing to gate the way the runtime names it: a tool
# name, or a dotted effect kind a brain emits. This template used to list
# `payment.send` / `filing.submit` / `external.publish`, none of which is a tool
# this company can run — so the fence it advertised gated nothing on the harness
# path (issue #684). `publish_artifact` is a real one, and it is the entry worth
# demonstrating: under `supervised` the gate already parks every publish, so
# this changes nothing today and keeps holding if the studio is ever moved to
# `auto` or `full`.
always_approve = ["publish_artifact"]
auto_approve_under_usd = 1.0

[place]
discoverable = false
skills = [
  { id = "opportunity.brief", price_usd = "49.00", description = "A ranked, evidence-backed weekly opportunity brief for a chosen market." },
]

# The opportunity-review desk validates the weekly signal synthesis before it reaches the operator.
[[group_chat]]
id = "opportunity_review"
name = "Opportunity review desk"
description = "Coordinate signal evidence, opportunity ranking, and the weekly brief."
members = ["signal_scout", "opportunity_analyst", "research_agent"]

# Workflow graphs to enable. The graphs live in this company's workflows/
# directory (one file per id), not inline here.
[workflows]
enabled = ["opportunity_pipeline"]

[budget]
monthly_usd = 200.0

# Weekly loop: scan fresh signals, cluster them into pains, rank opportunities,
# and deliver the digest to the operator. Monday 06:00.
[[schedule]]
cron = "0 6 * * 1"
prompt = "Scan this week's signals, cluster them into pains, rank the top opportunities, and send the operator a ranked brief."
