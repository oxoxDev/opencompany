# Agent roster for the Agentic Consulting Firm harness.
# The OpenCompany host instantiates one runtime agent per `agents/<id>.toml`, backed by
# the vendored OpenHuman / TinyAgents modules.

[company]
name = "Agentic Consulting Firm"
output = "Strategy decks and implementation plans"
human_role = "Executive workshops"

[tools]
# Full tool belt plus the metered `web_search` (#238, granted here in #312): this
# company's skills instruct agents to search broadly and cite their sources, and
# nothing in the `web` namespace can *find* a URL — `web_fetch` / `http_request`
# only read one the agent already has.
#
# Every entry below is load-bearing. `allow` REPLACES the default
# (`["*", "media", "composio"]`); it never extends it. `*` covers
# files/docs/shell/code/web/subagent but deliberately excludes the opt-in
# namespaces, so `media`, `composio` and `search` are each listed literally.
# Reducing this line to `["search"]` would silently strip the whole belt from
# every agent in the company.
#
# Search spend is bounded by `[tools].search_daily_calls` (200/day by default);
# setting it to `0` pauses search without editing this list.
allow = ["*", "media", "composio", "search"]

# The engagement-delivery desk aligns the recommendation, client deck, and implementation plan.
[[group_chat]]
id = "engagement_delivery"
name = "Engagement delivery desk"
description = "Coordinate the client-ready strategy and implementation materials."
members = ["strategist", "deck_builder", "implementation_planner"]

# Workflow graphs to enable. The graphs live in this company's workflows/
# directory (one file per id), not inline here.
[workflows]
enabled = ["engagement_pipeline"]

# Approval tier for this company (issue #605). Declared explicitly rather than
# left to the serde default, so the tier a shipped company runs on is readable
# from its own manifest instead of inferred from an absent block.
#
# `auto` runs the agent's own sandbox writes and outward reads unattended and
# still parks everything that leaves the company or spends money. `always_approve`
# is omitted, so it keeps its default.
[policy]
mode = "auto"
