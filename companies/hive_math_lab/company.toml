# The Agentic Math Lab, re-seated as one hive-mind desk.
#
# `companies/math_lab` splits the work across four one-member desks and
# an orchestrator that hands it from one to the next. This bundle keeps the
# same working roles — decide the approach, write the program, break the
# result — and adds three more instruments the hand-off chain had no seat for
# (a literal reading of the statement, a brute force with no clever step to be
# wrong about, and a memory of what this lab already knows), then seats all
# six **on one desk**, so an operator's problem is answered by a tinyhivemind
# deliberation episode rather than by a single lead's turn
# (`docs/spec/runtime/hivemind.md`). Nobody dispatches anybody: each member
# bids on the salience of what has been said, the highest bid takes the floor,
# and the desk carries an answer only once a quorum of distinct, differently
# equipped members has grounded support for it.
#
# The acceptance test is the same as the parent lab's: a Project Euler problem
# stated in the desk, and the integer the room converges on checked against the
# published one. `scripts/hive-euler.py` drives that loop headlessly across a
# ladder of problem difficulties.

[company]
name = "Hive Math Lab"
output = "Verified answers to computational problems, decided by a deliberating desk rather than a single solver"
human_role = "State the problem in the solvers desk and accept the answer the room converges on"

[policy]
# See the parent bundle: `full` opens only the agent's own sandbox, and `shell`
# still parks for approval on every tier. A headless driver has to pump the
# approvals queue (`scripts/hive-euler.py` does).
mode = "full"

[users]
admins = ["harness-e2e@tinyhumans.ai"]

[tools]
# No `web`, no `search`: the answer has to be computed, not looked up. See the
# parent bundle for the full argument.
allow = ["files", "docs", "shell", "code", "workspace", "workspace.*", "mcp:*"]

# A live run routes inference through the local llm-ladder-router, so it costs
# marketplace rates rather than a hosted subscription: point the managed
# endpoint at it with `OPENCOMPANY_INFERENCE_URL=http://127.0.0.1:6969/v1` and
# `OPENCOMPANY_INFERENCE_KEY=$LADDER_API_KEY`. The tier map below names the
# ladder's own model ids (`flash`, `reasoning`, `max-reasoning`); it applies
# whichever endpoint answers, so a hosted run needs the map removed or
# re-pointed at real model slugs. Three of the six solvers deliberately name
# no `tier` at all: the skeptic, the brute forcer and the archivist do work
# that does not need the strongest model bought, so they fall through to
# `chat-v1` / `flash` — cheap on purpose, not by oversight.

[inference]
models = { "chat-v1" = "flash", "reasoning-v1" = "reasoning", "agentic-v1" = "max-reasoning", "vision-v1" = "flash" }

# ---------------------------------------------------------------------------
# The one desk that matters.
#
# Six members, six different instruments, three of them cheap. The theorist
# reduces, the programmer is the only one who may put a number on the floor,
# the verifier attacks it from an independent implementation, the skeptic
# attacks the *reading* rather than the arithmetic, the brute forcer is the
# one check with no clever step to be wrong about, and the archivist is the
# desk's memory — recalling what this lab has already solved before anybody
# starts, and writing the method down once a number survives. A quorum of
# three means an answer needs grounded support from three differently
# equipped members, not just two identical proposals — see
# `docs/spec/runtime/hivemind.md` for the moves each is restricted to and
# `agents/prompts/*.md` for why. Four of the six may ever `!support` (below),
# so a quorum of three has one seat of slack rather than needing every
# eligible member every time.
# ---------------------------------------------------------------------------

[[group_chat]]
id = "solvers"
name = "Solvers desk"
description = "One problem at a time. Reduce it, program it, read it literally, brute-force it, remember it, and commit only what survived all four."
members = [
    "theorist",
    "programmer",
    "verifier",
    "skeptic",
    "brute_forcer",
    "archivist",
]

[group_chat.routing]
# Completion-driven episodes (`docs/spec/runtime/hive.md`): the desk's seats run
# in concurrent rounds until every assigned seat calls `complete_episode`.
# Round width, round cap and turn timeout take the library defaults here.

[[group_chat]]
id = "records"
name = "Records desk"
description = "Writing the accepted answer and its method down where the next problem can find them."
members = ["scribe"]

[workflows]
enabled = ["euler_solve"]
