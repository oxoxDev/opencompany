# Cut a PRODUCTION release from the `release` branch: bump the version, tag
# `v<version>`, build and notarize both macOS DMGs plus the
# auto-updater's artifacts, write the release notes, and publish the GitHub
# Release — all from one dispatch.
#
# Step three of the release flow (docs/spec/runtime/releases.md):
#
#   promote-main-to-release  →  release-staging  →  release-production
#
# DISPATCH IT FROM `release`. Pick `release` in the "Use workflow from"
# dropdown; any other branch fails in the first step. There is no tag to type:
# the version is computed from the tree by `release_type`, so the ONE decision
# is patch / minor / major. Everything else — the draft, the notes, the builds,
# the manifest, the publish — follows without another dispatch.
#
#   gh workflow run release-production.yml --ref release -f release_type=patch
#
# WHAT HAPPENS, IN ORDER
#
#   prepare-build   bump every version file (scripts/release/bump-version.mjs),
#                   commit `chore(release): v<version> [skip ci]` to release,
#                   tag it, merge release back into main.
#   create-release  generate the notes and create the Release AS A DRAFT.
#   build-desktop   both DMGs, signed + notarized, plus the updater archives,
#                   attached to the draft (build-desktop.yml).
#   publish-docker  the tenant image, built from the tag (so it reports the
#                   bumped version), checked by the sentry-test gate, and
#                   pushed to GHCR as `:v<version>`. The only place a release
#                   image is built.
#
# There is deliberately NO separate build-and-test job. Everything on `release`
# arrived through a PR that ran `ci.yml`, and the promotion dispatches `ci.yml`
# on the snapshot; the desktop and Docker builds below compile the tag with
# `--locked` anyway. A third compile of the same tree added ~30 minutes to
# every cut and found nothing the other two would not.
#   updater-manifest `latest.json` assembled from both architectures' assets.
#   promote-image   point GHCR `:latest` at `:v<version>` (same digest, no
#                   rebuild) once everything else has succeeded.
#   publish-release check every required asset is on the draft, then flip it
#                   public. Immutable releases freeze the asset list at that
#                   moment, so a published release is by construction complete.
#   cleanup         if anything failed after the tag was pushed, delete the
#                   draft and the tag, so the next dispatch bumps cleanly and
#                   nothing half-built is reachable.
#
# WHY A DRAFT. This repository has immutable releases: `POST .../assets` on a
# published release is rejected. It failed exactly that way on v0.0.1-rc.1 —
# both architectures notarized and stapled, and both then failed to attach to
# a release that had been frozen 40 minutes earlier. A draft is mutable; the
# release becomes public already carrying everything.
#
# `create_release: false` runs the bump and the builds but
# tags nothing and creates no Release — the DMGs land as Actions artifacts. It
# is a rehearsal; the version still moves.
#
# Issue #590. Every `uses:` below is a full commit SHA with the resolved version
# in a trailing comment; the rationale is at the top of `ci.yml`. Local
# reusable workflows (`./.github/workflows/...`) carry no SHA because they run
# at this workflow's own commit — the pin check in `ci.yml` exempts them. It
# matters most here: this workflow holds `contents: write` and publishes what
# users download.
name: Release Production

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: How far the version moves.
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]
      create_release:
        description: Tag and publish the GitHub Release. Off = bump and build only (a rehearsal).
        required: false
        type: boolean
        default: true

# Read by default; the jobs that push, create, publish or delete say so
# themselves. A compromised build step then cannot write to the repository.
permissions:
  contents: read

concurrency:
  group: release-production
  cancel-in-progress: false

jobs:
  prepare-build:
    name: Bump version and tag
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    # The XGITHUB_APP_* secrets live in this environment, never at repo level.
    # It holds ONLY those two secrets and is branch-policied to `main` and
    # `release`, so no other ref can claim it and no build job ever sees a
    # token that can bypass the branch rulesets.
    environment: Release-PR-Automation
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      sha: ${{ steps.resolve.outputs.sha }}
      build_ref: ${{ steps.resolve.outputs.build_ref }}
    steps:
      - name: Enforce the release branch
        if: github.ref != 'refs/heads/release'
        run: |
          echo "::error::Release Production runs from the release branch only (got $GITHUB_REF). Promote main first (promote-main-to-release.yml), then pick 'release' in the 'Use workflow from' dropdown." >&2
          exit 1

      # Least privilege: this job only pushes the version-bump commit and tag
      # (and the back-merge to main) — contents: write covers that. It also
      # needs workflows: write: the back-merge into `main` can carry changes
      # under `.github/workflows/**`, and GitHub rejects a GitHub App push
      # that touches a workflow file unless the token holds that permission
      # explicitly. Branch-ruleset bypass (repository settings → Rules) comes
      # from the App's identity in the ruleset bypass list, not from token
      # scopes; a push made with GITHUB_TOKEN would be rejected by
      # `Protect main` / `Protect release`.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.XGITHUB_APP_ID }}
          private-key: ${{ secrets.XGITHUB_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-workflows: write

      - name: Checkout release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release
          fetch-depth: 0
          # This job PUSHES. `actions/checkout` stores the App token as an
          # `http.extraheader` for this checkout only, which is what `git push`
          # below authenticates with — no token in a remote URL, nothing that
          # `set -x` could ever print. Every other checkout in this repo says
          # `false`; those jobs do not push.
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Configure git
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin --tags --prune --prune-tags
          git checkout release
          git pull origin release --ff-only

      - name: Bump version (${{ inputs.release_type }})
        id: bump
        run: node scripts/release/bump-version.mjs "${{ inputs.release_type }}"

      - name: Verify version sync
        run: node scripts/release/verify-version-sync.mjs "${{ steps.bump.outputs.version }}"

      - name: Ensure tag does not already exist
        if: inputs.create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1 || git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
            echo "::error::Tag $TAG already exists. The version bump would collide with it; look at how the tree got behind that tag." >&2
            exit 1
          fi
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::A GitHub Release named $TAG already exists (a leftover draft?). Delete it, then re-dispatch." >&2
            exit 1
          fi

      # `[skip ci]` does real work here: a push made as the App DOES fire `push`
      # workflows (unlike one made with GITHUB_TOKEN), and the commit changes
      # version numbers only, so there is nothing for `ci.yml` to learn.
      #
      # The files staged are the ones the bump script reports it wrote, so the
      # commit can never miss a file the registry gained. Branch and tag go in
      # ONE `--atomic` push: either both land or neither, so a tag that races
      # another dispatch cannot leave a stray bump commit behind.
      - name: Commit and push version bump
        id: push
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          FILES: ${{ steps.bump.outputs.files }}
          TAG: ${{ steps.bump.outputs.tag }}
          CREATE_RELEASE: ${{ inputs.create_release }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086 # FILES is a space-separated list by contract
          git add -- $FILES
          git commit -m "chore(release): v${VERSION} [skip ci]"
          if [ "$CREATE_RELEASE" = "true" ]; then
            git tag -a "$TAG" -m "Release $TAG"
            git push --atomic origin HEAD:release "refs/tags/$TAG"
          else
            echo "Skipping tag creation (create_release=false)"
            git push origin HEAD:release
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Resolve build outputs
        id: resolve
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          TAG: ${{ steps.bump.outputs.tag }}
          SHA: ${{ steps.push.outputs.sha }}
          CREATE_RELEASE: ${{ inputs.create_release }}
        run: |
          {
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "sha=$SHA"
            if [ "$CREATE_RELEASE" = "true" ]; then echo "build_ref=$TAG"; else echo "build_ref=$SHA"; fi
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Production cut \`$TAG\`"
            echo ""
            echo "Version \`$VERSION\` at \`$SHA\` on \`release\`."
          } >> "$GITHUB_STEP_SUMMARY"

      # So main's version never falls behind the last release. `continue-on-error`:
      # a conflicted back-merge must not strand a release that is already
      # tagged; the warning says to merge by hand.
      - name: Merge release back into main
        continue-on-error: true
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          bash scripts/release/merge-release-into-main.sh "chore(release): merge release v${VERSION} back into main"

  create-release:
    name: Draft release with notes
    needs: [prepare-build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    # OPENAI_API_KEY (the AI release notes) lives in this environment, not at
    # repository level. Branch-policied to `main` and `release`; this job only
    # runs after `prepare-build` has refused any ref but `release`.
    environment: Production
    steps:
      - name: Nothing to draft
        if: ${{ !inputs.create_release }}
        run: echo "create_release=false — no GitHub Release is created; builds upload as Actions artifacts."

      # `fetch-depth: 0`: the notes generator walks `<previous release>..<tag>`
      # and reads EVERY author before the range to tell a first-time
      # contributor from a returning one. Under a shallow checkout `git log
      # A..B` prints nothing for an unknown A and the notes come out empty and
      # green — the one failure mode worth a full clone to remove.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.create_release
        with:
          ref: ${{ needs.prepare-build.outputs.build_ref }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: inputs.create_release
        with:
          node-version: 22
          package-manager-cache: false

      # `continue-on-error` plus the fallback below, not `||` inside one step:
      # a failed OpenAI call must still leave a `release-notes.md` behind, and
      # the two-step form makes WHICH renderer ran visible in the job log. The
      # step cap sits ABOVE the generator's own 300s OpenAI abort so a hung API
      # is reported by the script, which names the timeout, rather than by the
      # step, which reports only "timed out".
      - name: Generate release notes (AI)
        id: ai-notes
        if: inputs.create_release
        continue-on-error: true
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TAG: ${{ needs.prepare-build.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "::warning::OPENAI_API_KEY is empty — falling back to deterministic notes."
            exit 1
          fi
          node scripts/release/generate-release-notes.mjs \
            --from latest-release --to "$TAG" --repo "$GITHUB_REPOSITORY" --output release-notes.md

      # NOT `continue-on-error`: if the deterministic renderer cannot produce
      # notes either, something is wrong with the range itself and the release
      # should not be cut with an empty body.
      - name: Generate release notes (deterministic)
        if: ${{ inputs.create_release && steps.ai-notes.outcome != 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare-build.outputs.tag }}
        run: |
          set -euo pipefail
          node scripts/release/generate-release-notes.mjs \
            --from latest-release --to "$TAG" --repo "$GITHUB_REPOSITORY" --no-ai --output release-notes.md

      - name: Print notes to job summary
        if: inputs.create_release
        run: cat release-notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Create draft release
        if: inputs.create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare-build.outputs.tag }}
          VERSION: ${{ needs.prepare-build.outputs.version }}
        run: |
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" \
            --draft \
            --title "OpenCompany v${VERSION}" \
            --notes-file release-notes.md \
            --verify-tag

  build-desktop:
    name: Build desktop
    needs: [prepare-build, create-release]
    permissions:
      contents: write # uploads into the draft Release
    uses: ./.github/workflows/build-desktop.yml
    # Only the repository-level Sentry token is passed. The APPLE_*,
    # APP_STORE_CONNECT_* and TAURI_SIGNING_* secrets live in the `Production`
    # environment, which the called workflow's own jobs declare — see its
    # `secrets:` note.
    secrets:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    with:
      build_ref: ${{ needs.prepare-build.outputs.build_ref }}
      tag: ${{ needs.prepare-build.outputs.tag }}
      sign: true
      with_updater: ${{ inputs.create_release }}
      with_release_upload: ${{ inputs.create_release }}

  # THE RELEASE TENANT IMAGE. boat.dev sandboxes run by
  # tinyhumansai/opencompany-sandbox-manager pull it straight from GHCR and
  # follow the newest GitHub Release (opencompany-sandbox-manager#6), so
  # `:v<version>` has to exist BEFORE `publish-release` makes that release
  # visible — hence `publish-release` needs this job.
  #
  # Built from `build_ref`, the TAG — the version-bump commit — so the image's
  # `/spec` reports the version it is published as. (The old
  # `publish-tenant-image.yml` fired on `workflow_run` and built
  # `workflow_run.head_sha`, the commit BEFORE the bump, so every `vX.Y.Z` image
  # reported the previous version, and it landed only after the release was
  # already public.)
  #
  # THE GHCR PACKAGE MUST BE PUBLIC. A sandbox's pull is anonymous: it holds no
  # GHCR credential, so `ghcr.io/tinyhumansai/opencompany` has to be made
  # **public** in the repository's package settings (Packages ->
  # opencompany -> Package settings -> Change visibility -> Public) — or
  # boat.dev must be handed a pull credential — or every pull gets
  # `denied: denied` and the sandbox cannot start. A freshly created GHCR package
  # is private by default; publishing succeeds while pulling silently fails
  # until that flip is done.
  #
  # `:latest` is NOT moved here: `promote-image` does that once the desktop
  # assets and the manifest are in, so a cut that fails later never leaves
  # `:latest` on a version that was never released. A rehearsal
  # (`create_release: false`) builds and runs the gate but pushes nothing.
  publish-docker:
    name: "Docker: build, verify, push to GHCR"
    needs: [prepare-build]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write # push the tenant image to GHCR under this repository's owner
    env:
      IMAGE: ghcr.io/tinyhumansai/opencompany
      TAG: ${{ needs.prepare-build.outputs.tag }}
    steps:
      - name: Checkout build ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare-build.outputs.build_ref }}
          persist-credentials: false
          submodules: true
      - name: Init vendored openhuman crate submodules
        run: scripts/ci/init-vendored-submodules.sh
      # Read from `deploy-staging.yml` rather than copied — see release-staging.yml.
      - name: Read the tenant feature set
        id: features
        run: |
          value="$(sed -n 's/^[[:space:]]*TENANT_FEATURES:[[:space:]]*//p' .github/workflows/deploy-staging.yml | head -1)"
          if [ -z "$value" ]; then
            echo "::error::could not read TENANT_FEATURES from deploy-staging.yml" >&2
            exit 1
          fi
          if ! [[ "$value" =~ ^[A-Za-z0-9_,-]+$ ]]; then
            echo "::error::TENANT_FEATURES in deploy-staging.yml is not a plain feature list: '$value'" >&2
            exit 1
          fi
          echo "value=$value" >> "$GITHUB_OUTPUT"
      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      # Every Sentry input the staging deploy passes, passed here for the same
      # reasons — the long rationale lives beside the build-args block in
      # `deploy-staging.yml` and is not repeated. The short version: the
      # console's half of crash reporting is inlined by Vite *during this build*,
      # so an env var set on the running tenant afterwards is a silent no-op, and
      # a release image built without them ships a console that reports nothing
      # however the tenant is configured (issue #2392).
      #
      # `|| 'hosted-tenant'` mirrors `deploy-staging.yml`: an empty build-arg is
      # not an unset one, and everything this image builds is a hosted tenant.
      #
      # `load: true` keeps the image in the local daemon so the gate below can
      # run it; `push` stays false here on purpose. The image is pushed only
      # AFTER the gate passes, and it is the very image the gate ran — the
      # loaded one, pushed by `docker push` — not a second build.
      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          load: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE }}:${{ needs.prepare-build.outputs.tag }}
          build-args: |
            FEATURES=${{ steps.features.outputs.value }}
            OPENCOMPANY_BUILD_COMMIT=${{ needs.prepare-build.outputs.sha }}
            VITE_BUILD_COMMIT=${{ needs.prepare-build.outputs.sha }}
            VITE_SENTRY_ENVIRONMENT=${{ vars.OPENCOMPANY_SENTRY_ENVIRONMENT || 'hosted-tenant' }}
            VITE_SENTRY_TRACES_SAMPLE_RATE=${{ vars.OPENCOMPANY_SENTRY_TRACES_SAMPLE_RATE }}
            SENTRY_URL=https://sentry.tinyhumans.ai
            SENTRY_ORG=tinyhumans
            SENTRY_PROJECT_REACT=opencompany-frontend
            SENTRY_PROJECT_RUST=opencompany-core
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
          cache-from: type=gha,scope=release-docker
          cache-to: type=gha,scope=release-docker,mode=max

      # The post-deploy gate this issue exists for. `opencompany sentry-test`
      # captures a test event and exits non-zero when nothing could be sent, so
      # running it against the image that is about to be released turns "crash
      # reporting silently stopped working" from something nobody notices into a
      # failed release.
      #
      # It runs the RELEASE IMAGE, not a checkout: the three things that break
      # here are the `crash-reporting` cargo feature being dropped from
      # `TENANT_FEATURES`, the compiled-in default DSN being wrong, and egress to
      # the ingest host being blocked. No DSN is passed: the container runs as a
      # hosted tenant (`OPENCOMPANY_DEPLOYMENT=hosted-tenant`), so it reports to
      # the compiled-in `opencompany-core` project exactly as a tenant does. Only the built artifact exercises all three, and the first
      # is invisible to every test that runs outside it — a build without the
      # feature resolves `Silence::NotCompiled` and reports nothing while every
      # environment variable looks perfect.
      #
      # `--entrypoint` because the image's entrypoint is the `serve` switch.
      #
      # Sending is only half the check. `sentry-test` exits zero once its queue
      # drains, which means the ingest ANSWERED — not that it kept anything, and
      # the spec has always said so. That gap is not theoretical: between
      # 2026-09-15 and 2026-09-18 this organisation's Sentry accepted zero events
      # while Relay went on answering `200 {"id":…}` to every sender, and a gate
      # that stopped at the exit code would have passed green throughout. So the
      # event is read BACK through the API, and only a stored event passes.
      #
      # The read is polled rather than done once: ingestion is asynchronous and
      # an event is not queryable the instant it is accepted. 120s, against the
      # 60s the issue asks for, because failing a release over a slow queue would
      # teach everyone to re-run the job until it goes green — which is how a
      # gate stops being one.
      #
      # `continue-on-error` is deliberately NOT set. A release that cannot report
      # its own crashes is the release least safe to ship blind.
      - name: Verify crash reporting (sentry-test)
        env:
          OPENCOMPANY_SENTRY_ENVIRONMENT: ${{ vars.OPENCOMPANY_SENTRY_ENVIRONMENT || 'hosted-tenant' }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_URL: https://sentry.tinyhumans.ai
          SENTRY_ORG: tinyhumans
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "::error::SENTRY_AUTH_TOKEN is not set, so this release cannot be shown to report crashes. See docs/spec/runtime/crash-reporting.md." >&2
            exit 1
          fi

          event_id="$(docker run --rm \
            --entrypoint opencompany \
            -e OPENCOMPANY_DEPLOYMENT=hosted-tenant \
            -e OPENCOMPANY_SENTRY_ENVIRONMENT \
            "${IMAGE}:${TAG}" \
            sentry-test --message "release-production ${TAG} ${GITHUB_RUN_ID}")"
          echo "sentry event id: ${event_id}"

          # Sentry stores event ids unhyphenated; the SDK prints a hyphenated
          # UUID. Looking up the printed form returns 404 forever.
          lookup="$(printf '%s' "$event_id" | tr -d '-')"
          url="${SENTRY_URL%/}/api/0/organizations/${SENTRY_ORG}/eventids/${lookup}/"

          for attempt in $(seq 1 24); do
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 \
              -H "Authorization: Bearer ${SENTRY_AUTH_TOKEN}" "$url" || echo 000)"
            case "$code" in
              200)
                echo "crash reporting verified: event ${event_id} is stored (after $((attempt * 5))s)" >> "$GITHUB_STEP_SUMMARY"
                exit 0
                ;;
              # Not "the event is missing" — "this token may not ask". Polling
              # for two minutes on an authorisation error would report the wrong
              # cause, and the fix (grant `org:read`) is nothing like the fix for
              # a discarded event.
              401 | 403)
                echo "::error::Sentry refused the readback with HTTP ${code}. SENTRY_AUTH_TOKEN needs org:read scope on ${SENTRY_ORG} to look up an event id. The event itself (${event_id}) was sent and may well have arrived." >&2
                exit 1
                ;;
            esac
            sleep 5
          done

          echo "::error::Sentry accepted event ${event_id} but never stored it (last lookup: HTTP ${code} after 120s). Reporting is NOT working: the ingest is answering while events are discarded. Check the Sentry instance's accepted-outcome stats, not this repository." >&2
          exit 1

      - name: Log in to GHCR
        if: inputs.create_release
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The exact image the gate above ran. `v<version>` is unique by
      # construction — `prepare-build` refused a tag that already exists.
      - name: Push the release image
        if: inputs.create_release
        run: |
          set -euo pipefail
          docker push "${IMAGE}:${TAG}"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "${IMAGE}:${TAG}")"
          {
            echo "### Tenant image"
            echo ""
            echo "\`${IMAGE}:${TAG}\` — \`${digest}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Moves `:latest` onto the release image as the LAST thing before the release
  # goes public, and only when every other job has succeeded — so a cut that
  # fails anywhere (and is cleaned up) never leaves `:latest` pointing at a
  # version that was never released. A registry-side retag: same manifest,
  # same digest as `:v<version>`, nothing rebuilt.
  promote-image:
    name: "Docker: point :latest at the release"
    needs: [prepare-build, build-desktop, publish-docker, updater-manifest]
    if: inputs.create_release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write # retag the tenant image in GHCR
    env:
      IMAGE: ghcr.io/tinyhumansai/opencompany
      TAG: ${{ needs.prepare-build.outputs.tag }}
    steps:
      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the release image latest
        run: |
          set -euo pipefail
          docker buildx imagetools create --tag "${IMAGE}:latest" "${IMAGE}:${TAG}"
          docker buildx imagetools inspect "${IMAGE}:latest"

  # `latest.json` is written into the DRAFT, before publish. A release
  # published without a manifest pins every existing install to the build it
  # already has — silently, with no error anywhere, permanently. The script
  # refuses a partial manifest naming only one architecture.
  updater-manifest:
    name: Publish updater manifest (latest.json)
    needs: [prepare-build, build-desktop]
    if: inputs.create_release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare-build.outputs.build_ref }}
          persist-credentials: false
      - name: Generate and upload latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare-build.outputs.tag }}
          VERSION: ${{ needs.prepare-build.outputs.version }}
          REPO: ${{ github.repository }}
        run: bash scripts/release/publish-updater-manifest.sh

  publish-release:
    name: Publish release
    needs: [prepare-build, create-release, build-desktop, publish-docker, updater-manifest, promote-image]
    if: inputs.create_release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Every asset a release must carry, or the release is not cut. The DMGs
      # are what a person installs; the archives and signatures are what an
      # installed client updates from; `latest.json` is how it finds them.
      - name: Validate required assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare-build.outputs.tag }}
        run: |
          set -euo pipefail
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' > assets.txt
          echo "Assets on $TAG:"; sed 's/^/  /' assets.txt
          missing=0
          for pattern in \
            '^OpenCompany_.*_aarch64\.dmg$' \
            '^OpenCompany_.*_x64\.dmg$' \
            '^OpenCompany_.*_aarch64\.app\.tar\.gz$' \
            '^OpenCompany_.*_aarch64\.app\.tar\.gz\.sig$' \
            '^OpenCompany_.*_x64\.app\.tar\.gz$' \
            '^OpenCompany_.*_x64\.app\.tar\.gz\.sig$' \
            '^latest\.json$'; do
            if ! grep -qE "$pattern" assets.txt; then
              echo "::error::required asset missing from $TAG: $pattern" >&2
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare-build.outputs.tag }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --draft=false --latest
          url="$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json url --jq .url)"
          echo "Published $url"
          {
            echo "### Published"
            echo ""
            echo "$url"
          } >> "$GITHUB_STEP_SUMMARY"

  # A release that failed after the tag was pushed must leave nothing behind:
  # the draft (asset-less or half-filled) and the tag both go, so the next
  # dispatch bumps to the next patch cleanly and nothing half-built is
  # reachable. The version-bump commit stays on `release`; that is harmless.
  # A `:v<version>` image already pushed to GHCR also stays: nothing pulls a
  # version no Release names, and `:latest` never moved (see `promote-image`).
  cleanup-failed-release:
    name: Remove draft and tag if a step failed
    # Including `publish-release`: a failed asset check or a failed
    # `gh release edit` is exactly the half-built state this job exists for.
    needs: [prepare-build, create-release, build-desktop, publish-docker, updater-manifest, promote-image, publish-release]
    if: >-
      always()
      && inputs.create_release
      && needs.prepare-build.result == 'success'
      && (needs.create-release.result == 'failure' || needs.create-release.result == 'cancelled'
          || needs.build-desktop.result == 'failure' || needs.build-desktop.result == 'cancelled'
          || needs.publish-docker.result == 'failure' || needs.publish-docker.result == 'cancelled'
          || needs.promote-image.result == 'failure' || needs.promote-image.result == 'cancelled'
          || needs.updater-manifest.result == 'failure' || needs.updater-manifest.result == 'cancelled'
          || needs.publish-release.result == 'failure' || needs.publish-release.result == 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Delete draft release and tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare-build.outputs.tag }}
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [ "$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = "true" ]; then
              gh release delete "$TAG" -R "$GITHUB_REPOSITORY" --yes && echo "Deleted draft release $TAG"
            else
              echo "::warning::Release $TAG is already published; leaving it and the tag alone."
              exit 0
            fi
          fi
          if gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}"; then
            echo "Deleted remote tag $TAG"
          else
            echo "::warning::Could not delete tag $TAG (already gone?)"
          fi
          echo "::error::A step failed; draft $TAG and its tag were removed. Fix the failure and re-dispatch." >&2
          exit 1
