# THROWAWAY. Delete this file before anything from this branch is proposed
# upstream — it exists to answer one question and then go away.
#
# THE QUESTION: does `crates/opencompany-app` compile and package on Windows?
#
# `opencompany-core` already does. That was settled by cross-compiling the full
# desktop feature set (including the vendored openhuman crate) to
# `x86_64-pc-windows-gnu` from a macOS checkout: clean, no errors. What that
# cannot reach is the Tauri shell itself — wry, tao, webview2-com — because
# those need MSVC, which does not exist off Windows. So the shell is the only
# unverified half, and this job is the cheapest way to verify it.
#
# It deliberately does NOT: sign, notarize, produce updater artifacts, touch a
# GitHub Release, or add itself to any required check. It builds, it bundles,
# it uploads the installer as an Actions artifact, and that is all. Everything
# it omits is real work that belongs in the matrix restructure of
# `build-desktop.yml`, not in a spike.
#
# Runs in the FORK (`oxoxDev/opencompany`) on push, so it costs upstream
# nothing and cannot appear in anyone's PR checks.
#
# Action pins and the toolchain version are copied from `build-desktop.yml` and
# `ci.yml` rather than floated, so this file stays consistent with the pinning
# rules the real workflows are held to (`scripts/ci/assert-toolchain-pin.sh`,
# and the `actions-pinned` lane).
name: Spike — Windows desktop build

on:
  push:
    branches:
      - spike/windows-desktop-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: "Desktop: x86_64-pc-windows-msvc"
    runs-on: windows-latest
    # Cold, uncached, and the graph is ~2100 crates. OpenHuman's Windows leg
    # takes ~50 minutes WITH a vendored CEF checkout; this has no CEF but also
    # no warm cache on the first run. The cap is a wedged-runner backstop.
    timeout-minutes: 120
    env:
      # The feature set the shipped desktop carries, over and above the default
      # in `crates/opencompany-app/Cargo.toml`. Must stay equal to
      # `DESKTOP_RELEASE_FEATURES` in `build-desktop.yml` — a spike that proved
      # a DIFFERENT feature combination would prove nothing about the release.
      DESKTOP_RELEASE_FEATURES: opencompany-core/acp,opencompany-core/composio
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      # `submodules: true` is not recursive. The vendored openhuman crate's own
      # path-dependency crates must resolve for Cargo even on a default build.
      # POSIX sh, so it runs under the runner's Git Bash.
      - name: Init vendored openhuman crate submodules
        shell: bash
        run: scripts/ci/init-vendored-submodules.sh

      # Disk is the failure mode most likely to be mistaken for a compile
      # error here: the hosted Windows runner ships ~14 GB free on C:, and this
      # target directory is large. Reported before and after so a red run can
      # be diagnosed from the log instead of re-run blind.
      - name: Disk before
        shell: bash
        run: df -h /c || true

      - name: Install Rust (rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.98.0"
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            crates/opencompany-app
          key: spike-windows

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # BEFORE the Tauri build. `beforeBuildCommand` is empty in
      # tauri.conf.json, so nothing else compiles `frontend/dist` — the bundler
      # would package a stale or missing dist otherwise.
      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # The whole point of the spike. Path-qualified CLI so the project
      # resolves to crates/opencompany-app/ rather than anything else on disk.
      # No `--no-bundle`: the NSIS/MSI packaging step is exactly what has never
      # run, and an installer nobody can download would answer half the
      # question.
      - name: Build and package Tauri app (unsigned)
        working-directory: crates/opencompany-app
        shell: bash
        run: |
          ../../frontend/node_modules/.bin/tauri build \
            --target x86_64-pc-windows-msvc \
            -- --locked --features "$DESKTOP_RELEASE_FEATURES"

      - name: Disk after
        if: always()
        shell: bash
        run: df -h /c || true

      # Listed rather than assumed. `bundle.targets` is `"all"`, which on
      # Windows means both NSIS and MSI — if one of them is missing this is
      # where that shows up, rather than in a silently short artifact.
      - name: List bundle output
        if: always()
        shell: bash
        run: |
          find crates/opencompany-app/target/x86_64-pc-windows-msvc/release/bundle \
            -type f \( -name '*.exe' -o -name '*.msi' \) -print 2>/dev/null || true

      - name: Upload installers
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opencompany-windows-x64-unsigned
          path: |
            crates/opencompany-app/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            crates/opencompany-app/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          if-no-files-found: error
